[project]
name = "meeting-extractor"
version = "0.1.0"
description = "Extract final decisions, actions and open issues from Vietnamese meeting transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=1.13",
    "streamlit>=1.35",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
